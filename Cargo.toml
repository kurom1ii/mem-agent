[package]
name = "mem-agent"
version = "0.1.0"
edition = "2021"
description = "High-performance persistent memory engine for AI coding agents"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled-full"] }
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
unicode-segmentation = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
wide = "1"
bytemuck = "1"
rayon = "1"
bincode = { version = "2", features = ["serde"] }
rand = "0.8"
ort = { version = "2.0.0-rc.12", default-features = true, features = ["cuda"] }
ndarray = "0.16"
tokenizers = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
